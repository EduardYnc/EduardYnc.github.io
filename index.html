<!DOCTYPE html>
<html>
  <head>
      <title>Supplementen Gids</title>
  </head>

  <style>
    body {
      display: flex;
      flex-direction: column; /* Zet alle onderdelen onder elkaar */
      align-items: center;    /* Centreert alles horizontaal */
      justify-content: center;/* Centreert alles verticaal */
      min-height: 100vh;      /* Zorgt dat de pagina de volle hoogte gebruikt */
      margin: 0;              /* Verwijdert de standaard witruimte rondom */
      text-align: center;     /* Centreert ook tekst binnen elementen */
    }

    /* Optioneel: voeg wat ruimte toe tussen elementen */
    img, div, button {
      margin-top: 10px;
    }

    .button-container {
            display: flex;
            flex-wrap: wrap;       
            gap: 15px;             
            justify-content: center;
            margin-top: 25px;
        }

        /* --- DONKERE / GRIJZE KNOPPEN --- */
        button {
            padding: 18px 32px;        
            font-size: 18px;           
            font-weight: bold;         
            text-transform: uppercase; 
            letter-spacing: 1px;       
            
            color: #ffffff;            
            /* Donkergrijs/zwart kleurverloop */
            background: linear-gradient(135deg, #2b2b2b, #1a1a1a); 
            border: 1px solid #3d3d3d; /* Subtiele grijze rand */
            border-radius: 8px;        
            cursor: pointer;          
            
            /* Subtiele donkere schaduw */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            transition: all 0.3s ease;
        }

        /* HOVER EFFECT (Lichter grijs bij zweven) */
        button:hover {
            background: linear-gradient(135deg, #3a3a3a, #282828); 
            border-color: #555555;
            transform: translateY(-3px);     
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8); 
        }

        /* KLIK EFFECT */
        button:active {
            transform: translateY(-1px);     
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }
  </style>
<body>

    <h1>De Eerlijke Supplementen Gids</h1>
    <p><strong> Kies een categorie en bekijk direct de beste opties uit de supermarkt of winkel. </strong></p>

  </div>

</body>
</html>
